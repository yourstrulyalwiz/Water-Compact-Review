openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Water Compact Review API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Compact document registry
  - name: candidates
    description: Reform-action candidates
  - name: anchors
    description: Source anchors and rectangles
  - name: relationships
    description: Candidate relationships
  - name: stats
    description: Summary statistics
  - name: reviewers
    description: Reviewer identity management
  - name: reviews
    description: Candidate review decisions

paths:
  /append-readiness/october-2026:
    get:
      operationId: getOctoberAppendReadiness
      tags: [documents]
      summary: Verify the ten bundled October PDFs without reading or changing the database
      description: Uses the same deployment access boundary as other read-only document endpoints. Checks only a fixed manifest; accepts no paths or database inputs.
      responses:
        "200":
          description: All ten deployed PDF hashes match the pinned package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OctoberAssetReadiness"
        "503":
          description: At least one bundled PDF is unavailable or does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OctoberAssetReadiness"
        "429":
          description: Too many asset checks; retry after the indicated interval

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all registered compact documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a single document by ID
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found

  /documents/{documentId}/pdf:
    get:
      operationId: getDocumentPdf
      tags: [documents]
      summary: Stream the exact active-dataset PDF bytes
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF bytes; X-Content-SHA256 is the expected manifest hash, not a substitute for client byte verification.
          headers:
            X-Content-SHA256:
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Document not found }
        "503": { description: Active v5 dataset is not available }

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List reform-action candidates with optional filters
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: stream
          in: query
          schema:
            type: string
        - name: final_status
          in: query
          schema: { type: string, enum: [Approved Reform, Rejected Non-reform, Consolidated, Pending] }
        - name: view
          in: query
          schema: { type: string, enum: [all, review_actions, final_approved, qa_sample] }
        - name: failed_criterion
          in: query
          schema: { type: string, enum: [C1, C2, C3, C4, C5, C6] }
        - name: primary_pillar
          in: query
          schema: { type: string }
        - name: tier1
          in: query
          schema: { type: string }
        - name: tier2
          in: query
          schema: { type: string }
        - name: scalable_solution
          in: query
          schema: { type: string }
        - name: financing_relevance
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: temporal_status
          in: query
          schema: { type: string }
        - name: cluster_role
          in: query
          schema: { type: string }
        - name: global_decision
          in: query
          schema: { type: string }
        - name: regional_decision
          in: query
          schema: { type: string }
        - name: unresolved_issue
          in: query
          schema: { type: boolean }
        - name: inclusion_decision
          in: query
          schema:
            type: string
        - name: confidence_level
          in: query
          schema:
            type: string
        - name: anchor_confidence
          in: query
          schema:
            type: string
        - name: reform_aspiration_status
          in: query
          schema:
            type: string
        - name: reform_type_tier_1
          in: query
          schema:
            type: string
        - name: human_review_status
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Free-text search across candidate_id, standardized action, actor, domain, source text
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: Paginated candidate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V5CandidateListResponse"

  /candidates/{candidateId}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a single candidate with all anchors
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate detail with anchors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V5CandidateDetail"
        "404":
          description: Not found

  /anchors/{anchorId}:
    get:
      operationId: getAnchor
      tags: [anchors]
      summary: Retired legacy anchor endpoint
      deprecated: true
      parameters:
        - name: anchorId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Anchor with rectangles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnchorDetail"
        "404":
          description: Not found

  /relationships:
    get:
      operationId: listRelationships
      tags: [relationships]
      summary: List relationships for a candidate
      parameters:
        - name: candidateId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of relationships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relationship"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Summary counts and breakdowns
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /export/decisions.csv:
    get:
      operationId: exportDecisionsCsv
      tags: [reviews]
      summary: Download the active dataset's append-only review events as CSV
      description: >
        Returns revision-bound Global and Regional review events in long form.
        Reviewer agreement is informational and does not authorize final status.
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: stream
          in: query
          schema:
            type: string
        - name: inclusion_decision
          in: query
          schema:
            type: string
        - name: confidence_level
          in: query
          schema:
            type: string
        - name: anchor_confidence
          in: query
          schema:
            type: string
        - name: reform_aspiration_status
          in: query
          schema:
            type: string
        - name: reform_type_tier_1
          in: query
          schema:
            type: string
        - name: human_review_status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /reviewers/register:
    post:
      operationId: registerReviewer
      tags: [reviewers]
      summary: Register a new reviewer with name and PIN
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerCredentials"
      responses:
        "201":
          description: Reviewer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerResponse"
        "400":
          description: Validation error
        "409":
          description: Name already taken
        "410":
          description: Self-registration is retired

  /reviewers/login:
    post:
      operationId: loginReviewer
      tags: [reviewers]
      summary: Authenticate a reviewer by name and PIN
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerCredentials"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerResponse"
        "401":
          description: Wrong PIN
        "404":
          description: Reviewer not found
        "410":
          description: Login is retired

  /candidates/{candidateId}/reviews:
    get:
      operationId: listCandidateReviews
      tags: [reviews]
      summary: List all human reviews for a candidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reviews list with conflict flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEventsResponse"
    post:
      operationId: submitCandidateReview
      tags: [reviews]
      summary: Submit a review decision for a candidate
      description: Reviewer identity is derived from the Bearer token issued at login/register. No reviewer_id in body.
      security:
        - bearerAuth: []
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewEventInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEvent"
        "400":
          description: Missing required fields
        "401":
          description: Missing or invalid Bearer token
        "404":
          description: Candidate not found
        "409":
          description: Assessment revision is stale

  /reviewers/authenticate:
    post:
      operationId: authenticateReviewer
      tags: [reviewers]
      summary: Select a reviewer identity for prototype attribution
      description: Name selection is not identity verification and grants no coordinator or finalization authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewerNameInput" }
      responses:
        "200":
          description: Prototype attribution token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewerResponse" }
        "400": { description: Invalid name }
        "401": { description: Unknown reviewer }

  /stage-resolutions:
    post:
      operationId: resolveReviewStage
      tags: [reviews]
      summary: Record an authoritative stage resolution
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StageResolutionInput" }
      responses:
        "201": { description: Resolution recorded }
        "403": { description: Verified coordinator assignment required }
        "409": { description: Assessment revision is stale }

  /candidates/{candidateId}/assessment-proposals:
    post:
      operationId: proposeAssessmentRevision
      tags: [reviews]
      summary: Submit a revision-bound proposed assessment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentProposalInput" }
      responses:
        "201": { description: Proposal recorded }
        "409": { description: Assessment revision is stale }

  /candidates/{candidateId}/finalizations:
    post:
      operationId: finalizeCandidate
      tags: [reviews]
      summary: Finalize only with verified authorization and all server-side gates
      security: [{ bearerAuth: [] }]
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinalizationInput" }
      responses:
        "201": { description: Final status recorded }
        "403": { description: Verified authorized coordinator required }
        "409": { description: Revision or workflow prerequisites are stale or unmet }

  /qa-checks:
    get:
      operationId: listQaChecks
      tags: [candidates]
      summary: List dataset QA queue
      responses:
        "200":
          description: QA records for active dataset
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JsonRecord" }

  /evidence/{evidenceId}:
    get:
      operationId: getEvidence
      tags: [candidates]
      summary: Get active-dataset evidence with candidate links and rectangles
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Evidence detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRecord" }
        "404": { description: Evidence not found }

  /evidence/{evidenceId}/corrections:
    post:
      operationId: submitEvidenceCorrection
      tags: [reviews]
      summary: Append a source-location correction without altering source evidence
      security: [{ bearerAuth: [] }]
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceCorrectionInput" }
      responses:
        "201": { description: Correction recorded }
        "409": { description: Candidate assessment revision is stale }

  /export/master.csv:
    get:
      operationId: exportMasterCsv
      tags: [reviews]
      summary: Export active dataset and current assessment with each named reviewer's latest decision, comments, and consensus snapshot
      responses:
        "200":
          description: UTF-8 CSV
          content:
            text/csv: { schema: { type: string } }
  /export/final-approved.csv:
    get:
      operationId: exportFinalApprovedCsv
      tags: [reviews]
      summary: Export only rows passing the server-side final-count gate
      responses:
        "200":
          description: UTF-8 CSV, headed even when empty
          content:
            text/csv: { schema: { type: string } }
  /export/review-history.csv:
    get:
      operationId: exportReviewHistoryCsv
      tags: [reviews]
      summary: Export every append-only reviewer decision with reviewer ID and name
      responses:
        "200":
          description: UTF-8 CSV
          content:
            text/csv: { schema: { type: string } }
  /export/evidence.csv:
    get:
      operationId: exportEvidenceCsv
      tags: [reviews]
      summary: Export active dataset evidence and provenance
      responses:
        "200":
          description: UTF-8 CSV
          content:
            text/csv: { schema: { type: string } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ReviewerToken
  schemas:
    OctoberPdfAsset:
      type: object
      required: [document_id, country_code, expected_sha256, actual_sha256, byte_size, status]
      properties:
        document_id: { type: string }
        country_code: { type: string }
        expected_sha256: { type: string }
        actual_sha256: { type: ["string", "null"] }
        byte_size: { type: ["integer", "null"] }
        status: { type: string, enum: [verified, missing, hash_mismatch, unreadable] }
    OctoberAssetReadiness:
      type: object
      required: [ready, read_only, database_accessed, checked_at, batch_key, package_sha256, asset_location, expected_documents, verified_documents, documents]
      properties:
        ready: { type: boolean }
        read_only: { type: boolean }
        database_accessed: { type: boolean }
        checked_at: { type: string, format: date-time }
        batch_key: { type: string }
        package_sha256: { type: string }
        asset_location: { type: string, enum: [bundled-documents] }
        expected_documents: { type: integer }
        verified_documents: { type: integer }
        documents:
          type: array
          items:
            $ref: "#/components/schemas/OctoberPdfAsset"
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Document:
      type: object
      required:
        - document_id
        - country
        - document_title
        - document_version
        - local_filename
        - official_source_url
        - sha256
        - file_size_bytes
        - page_count
        - page_numbering_basis
        - anchor_coordinate_system
        - generated_at_utc
      properties:
        document_id:
          type: string
        country:
          type: string
        document_title:
          type: string
        document_version:
          type: string
        local_filename:
          type: string
        official_source_url:
          type: string
        sha256:
          type: string
        file_size_bytes:
          type: number
        page_count:
          type: number
        page_numbering_basis:
          type: string
        pdf_creator:
          type: ["string", "null"]
        pdf_producer:
          type: ["string", "null"]
        pdf_creation_date:
          type: ["string", "null"]
        pdf_modified_date:
          type: ["string", "null"]
        anchor_coordinate_system:
          type: string
        generated_at_utc:
          type: string

    Candidate:
      type: object
      required:
        - candidate_id
        - country
        - source_reference
        - compact_form
        - original_compact_text
        - standardized_candidate_reform_action
        - detailed_description
        - candidate_stream
        - inclusion_decision
        - reform_action_tag
        - count_in_reform_total
        - confidence_level
        - decision_rationale
        - water_security_pillar
        - solution_area
        - reform_type_tier_1
        - reform_type_tier_2
        - responsible_entity
        - human_review_status
        - reform_aspiration_status
        - criterion_assessment
      properties:
        candidate_id:
          type: string
        country:
          type: string
        source_reference:
          type: string
        compact_form:
          type: string
        original_compact_text:
          type: string
        standardized_candidate_reform_action:
          type: string
        detailed_description:
          type: string
        candidate_stream:
          type: string
        inclusion_decision:
          type: string
        reform_action_tag:
          type: string
        count_in_reform_total:
          type: string
        confidence_level:
          type: string
        decision_rationale:
          type: string
        water_security_pillar:
          type: string
        solution_area:
          type: string
        reform_type_tier_1:
          type: string
        reform_type_tier_2:
          type: string
        responsible_entity:
          type: string
        related_parent_id:
          type: ["string", "null"]
        human_review_status:
          type: string
        reviewer_comment:
          type: ["string", "null"]
        final_validated_action:
          type: ["string", "null"]
        reform_aspiration_status:
          type: string
        criterion_assessment:
          type: string
        review_count:
          type: number
        has_conflict:
          type: boolean

    AnchorSummary:
      type: object
      required:
        - anchor_id
        - candidate_id
        - document_id
        - anchor_role
        - anchor_type
        - source_reference
        - page_start
        - page_end
        - matched_page
        - page_label
        - verbatim_source_text
        - anchor_confidence
        - human_review_status
        - created_at_utc
      properties:
        anchor_id:
          type: string
        candidate_id:
          type: string
        document_id:
          type: string
        anchor_role:
          type: string
        anchor_type:
          type: string
        linked_candidate_id:
          type: ["string", "null"]
        source_reference:
          type: string
        page_start:
          type: number
        page_end:
          type: number
        matched_page:
          type: number
        page_label:
          type: string
        section_or_table:
          type: ["string", "null"]
        verbatim_source_text:
          type: string
        normalized_source_text:
          type: string
        quote_sha256:
          type: string
        match_method:
          type: string
        match_score:
          type: ["number", "null"]
        token_f1:
          type: ["number", "null"]
        token_precision:
          type: ["number", "null"]
        token_recall:
          type: ["number", "null"]
        sequence_similarity:
          type: ["number", "null"]
        anchor_confidence:
          type: string
        automated_validation_status:
          type: string
        human_review_status:
          type: string
        reviewer_comment:
          type: ["string", "null"]
        created_at_utc:
          type: string

    Rectangle:
      type: object
      required:
        - rectangle_id
        - anchor_id
        - page_number
        - x0
        - y0
        - x1
        - y1
        - x0_normalized
        - y0_normalized
        - x1_normalized
        - y1_normalized
        - page_width_points
        - page_height_points
        - coordinate_origin
        - coordinate_unit
      properties:
        rectangle_id:
          type: string
        anchor_id:
          type: string
        page_number:
          type: number
        x0:
          type: number
        y0:
          type: number
        x1:
          type: number
        y1:
          type: number
        x0_normalized:
          type: number
        y0_normalized:
          type: number
        x1_normalized:
          type: number
        y1_normalized:
          type: number
        page_width_points:
          type: number
        page_height_points:
          type: number
        coordinate_origin:
          type: string
        coordinate_unit:
          type: string

    AnchorDetail:
      allOf:
        - $ref: "#/components/schemas/AnchorSummary"
        - type: object
          required: [rectangles]
          properties:
            rectangles:
              type: array
              items:
                $ref: "#/components/schemas/Rectangle"

    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/Candidate"
        - type: object
          required: [anchors]
          properties:
            anchors:
              type: array
              items:
                $ref: "#/components/schemas/AnchorDetail"

    CandidateListResponse:
      type: object
      required: [candidates, total, page, limit]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    Relationship:
      type: object
      required:
        - relationship_id
        - source_candidate_id
        - target_candidate_id
        - relationship_type
        - relationship_status
        - human_review_status
      properties:
        relationship_id:
          type: string
        source_candidate_id:
          type: string
        target_candidate_id:
          type: string
        relationship_type:
          type: string
        relationship_status:
          type: string
        source_anchor_id:
          type: ["string", "null"]
        target_anchor_id:
          type: ["string", "null"]
        human_review_status:
          type: string
        reviewer_comment:
          type: ["string", "null"]

    ReviewerCredentials:
      type: object
      required: [display_name, pin]
      properties:
        display_name:
          type: string
        pin:
          type: string

    ReviewerResponse:
      type: object
      required: [reviewer_id, display_name, token]
      properties:
        reviewer_id:
          type: string
        display_name:
          type: string
        token:
          type: string
          description: Signed session token. Pass as Authorization Bearer on review submissions.

    CandidateReview:
      type: object
      required:
        - review_id
        - candidate_id
        - reviewer_id
        - reviewer_name
        - inclusion_decision
        - created_at
      properties:
        review_id:
          type: number
        candidate_id:
          type: string
        reviewer_id:
          type: string
        reviewer_name:
          type: string
        inclusion_decision:
          type: string
        comment:
          type: ["string", "null"]
        created_at:
          type: string

    CandidateReviewsResponse:
      type: object
      required: [reviews, has_conflict]
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/CandidateReview"
        has_conflict:
          type: boolean

    SubmitReviewRequest:
      type: object
      required: [inclusion_decision]
      properties:
        inclusion_decision:
          type: string
        comment:
          type: ["string", "null"]

    CountByKey:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: number

    StatsResponse:
      type: object
      required:
        - dataset_id
        - total_candidates
        - total_documents
        - total_evidence
        - total_relationships
        - count_in_final_reform_total
        - by_country
        - by_stream
        - by_final_status
      properties:
        dataset_id:
          type: string
        total_candidates:
          type: number
        total_documents:
          type: number
        total_evidence:
          type: number
        total_relationships:
          type: number
        count_in_final_reform_total:
          type: number
        by_country:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        by_stream:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        by_final_status:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"

    JsonRecord:
      type: object
      additionalProperties: true

    V5Candidate:
      allOf:
        - $ref: "#/components/schemas/JsonRecord"
      description: Dataset-scoped candidate baseline, current assessment, derived workflow state, and final-count gate.

    V5CandidateListResponse:
      type: object
      required: [candidates, total, page, limit, dataset_id]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/V5Candidate" }
        total: { type: number }
        page: { type: number }
        limit: { type: number }
        dataset_id: { type: string }

    V5CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/V5Candidate"
        - type: object
          properties:
            evidence:
              type: array
              items: { $ref: "#/components/schemas/JsonRecord" }
            relationships:
              type: array
              items: { $ref: "#/components/schemas/JsonRecord" }
            review_events:
              type: array
              items: { $ref: "#/components/schemas/JsonRecord" }

    ReviewerNameInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1 }

    ReviewEventInput:
      type: object
      required: [stage, decision, expected_assessment_revision]
      properties:
        stage: { type: string, enum: [Global, Regional] }
        decision:
          type: string
          enum: [Approve, Revise, Reject, Consolidate, Needs Discussion, Confirm, Confirm with Revision, Disagree, Pending]
        comment: { type: ["string", "null"] }
        expected_assessment_revision: { type: number, minimum: 1 }

    ReviewEvent:
      type: object
      required: [event_id, candidate_id, stage, decision, assessment_revision, created_at]
      properties:
        event_id: { type: string }
        candidate_id: { type: string }
        reviewer_id: { type: string }
        reviewer_name: { type: string }
        stage: { type: string }
        decision: { type: string }
        comment: { type: ["string", "null"] }
        assessment_revision: { type: number }
        created_at: { type: string }
        identity_verified: { type: boolean }

    ReviewEventsResponse:
      type: object
      required: [events, has_unresolved_disagreement]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/ReviewEvent" }
        has_unresolved_disagreement: { type: boolean }

    AssessmentProposalInput:
      type: object
      required: [expected_assessment_revision, changes, reason]
      properties:
        expected_assessment_revision: { type: number, minimum: 1 }
        changes:
          type: object
          additionalProperties: true
        reason: { type: string, minLength: 1 }

    StageResolutionInput:
      type: object
      required: [dataset_id, candidate_id, stage, expected_assessment_revision, decision, reason]
      properties:
        dataset_id: { type: string }
        candidate_id: { type: string }
        stage: { type: string, enum: [Global, Regional] }
        expected_assessment_revision: { type: number, minimum: 1 }
        decision: { type: string }
        reason: { type: string, minLength: 1 }

    FinalizationInput:
      type: object
      required: [expected_assessment_revision, final_status, reason]
      properties:
        expected_assessment_revision: { type: number, minimum: 1 }
        final_status: { type: string, enum: [Approved Reform, Rejected Non-reform, Consolidated, Pending] }
        survivor_candidate_id: { type: ["string", "null"] }
        reason: { type: string, minLength: 1 }

    EvidenceCorrectionInput:
      type: object
      required: [expected_assessment_revision, reason]
      properties:
        expected_assessment_revision: { type: number, minimum: 1 }
        corrected_page: { type: ["number", "null"], minimum: 1 }
        correction: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 1 }
